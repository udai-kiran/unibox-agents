services:
  agents:
    image: unibox-agents:latest
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    stdin_open: true
    tty: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 1024
    environment:
      - COLORTERM # pass the host terminal's truecolor support through
      # Optional: API-key auth instead of interactive login. Unset = ignored.
      - ANTHROPIC_API_KEY
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - DEEPSEEK_API_KEY
    volumes:
      - workspace:/workspace
      - zsh-history:/home/agent/.zsh_history.d
      - inodex:/home/agent/.inodex # agent mailboxes; the traces service reads them
      - claude:/home/agent/.claude
      - codex:/home/agent/.codex
      - gemini:/home/agent/.gemini # agy keeps its state in ~/.gemini/antigravity-cli
      - dsh:/home/agent/.dsh
      - pi:/home/agent/.pi
      - opencode-config:/home/agent/.config/opencode
      - opencode-data:/home/agent/.local/share/opencode

  # Read-only web view of the inodex mailboxes (message traces) at http://127.0.0.1:8000
  traces:
    image: unibox-agents:latest
    working_dir: /home/agent/traces
    command: ["/home/agent/.venvs/traces/bin/uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    read_only: true
    volumes:
      - inodex:/home/agent/.inodex:ro

volumes:
  workspace:
  inodex:
  zsh-history:
  claude:
  codex:
  gemini:
  dsh:
  pi:
  opencode-config:
  opencode-data:
